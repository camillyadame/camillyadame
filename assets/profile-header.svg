<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Camilly Adame — desenvolvedora full-stack</title>
  <desc id="desc">Cabeçalho do perfil: Camilly Adame, desenvolvedora full-stack e estudante de Ciência de Dados, aberta a vagas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1233"/>
      <stop offset="1" stop-color="#07061a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#b7a6ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#b7a6ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ascii" width="24" height="24" patternUnits="userSpaceOnUse">
      <text x="6" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#cdd5e3" fill-opacity="0.07">+</text>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="20" fill="url(#ascii)"/>
  <rect width="1200" height="300" rx="20" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="20" fill="none" stroke="#cad5e2" stroke-opacity="0.14"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="64" y="78" font-size="20" fill="#8f98ad"><tspan fill="#b8ff5a">~</tspan>/camilly-adame</text>
    <text x="64" y="146" font-size="54" fill="#f6f4fa">Camilly Adame</text>
    <text x="64" y="192" font-size="22" fill="#cdd5e3">Desenvolvedora full-stack · Ciência de Dados (Univesp)</text>
    <circle cx="71" cy="240" r="6" fill="#b8ff5a"/>
    <text x="90" y="247" font-size="19" fill="#8f98ad">aberta a vagas · remoto, híbrido ou mudança de cidade</text>
    <text x="1030" y="146" font-size="54" fill="#f6f4fa">a<tspan fill="#ff4fa3">.</tspan><tspan fill="#b8ff5a">_</tspan></text>
  </g>
</svg>
